[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

; Pin dependency versions after the first green build for reproducibility.
; Iteration 01 (hardware + Wi-Fi smoke test) dependencies:
;   adafruit/Adafruit BMP280 Library  -> BMP280 over I2C (pulls Adafruit BusIO + Unified Sensor)
;   beegee-tokyo/DHT sensor library for ESPx (DHTesp) -> DHT11 on one GPIO with checksum/status
lib_deps =
  adafruit/Adafruit BMP280 Library@^2.6.8
  beegee-tokyo/DHT sensor library for ESPx@^1.19

; The Web UI is embedded into the firmware straight from web/index.html by the
; espressif32 builder (objcopy binary -> .rodata). No filesystem image, no
; uploadfs step and no build-time copy of the page inside src/.
board_build.embed_files = web/index.html

build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; Logging mode: 0 = NORMAL (default), 1 = DEBUG.
  ;   NORMAL: boot/init, Wi-Fi connect/disconnect, contract verification, gateway
  ;           probe, HTTP start/stop, every [ERROR], and a periodic line only
  ;           when something is actually wrong (no 5 s heartbeat noise).
  ;   DEBUG : adds every [*][DEBUG] line, the 5 s Wi-Fi/HTTP snapshots and the
  ;           per-request HTTP/API logs for troubleshooting.
  ; Flip to 1, rebuild and reflash to get the full diagnostic stream.
  -DWS_DEBUG_LOGS=0
  ; Display backend: 0 = NONE (no panel attached — the shipped configuration),
  ; 1 = ILI9341 (reserved: the build stops with an explanatory message until the
  ;     real module's wiring/SPI/flush and the LVGL display driver exist).
  ; The station, the API and the Web UI are fully functional with 0.
  -DDISPLAY_BACKEND=0
