<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ESP32 Weather Station — numeric, horizontal, bars, gauges and history views.">
  <!-- Inline data URI: no favicon request leaves the device (fully offline). -->
  <link rel="icon" href="data:,">
  <title>ESP32 Weather Station</title>
  <style>
    /* ==================================================================
       Presentation only. Semantic colour ROLES (temp-cold, humidity-high,
       pressure-normal, …) and DATA STATES (FRESH/STALE/ERROR) are produced by
       JavaScript; CSS decides how each role/state LOOKS.
       ================================================================== */
    :root {
      /* semantic metric + state colours (single source: mirrored in firmware) */
      --role-temp-cold: #4c9bff;
      --role-temp-comfort: #43d19e;
      --role-temp-hot: #ff6b5e;
      --role-humidity-low: #ffc14d;
      --role-humidity-comfort: #2fd3c0;
      --role-humidity-high: #9b7bff;
      --role-pressure-low: #7f8cff;
      --role-pressure-normal: #43d19e;
      --role-pressure-high: #ffa04d;

      --state-fresh: #43d19e;
      --state-stale: #ffc14d;
      --state-error: #ff6b5e;
      --focus: #6fa8ff;

      /* metric identity colours for the history lines (state is added on top) */
      --metric-temperature: #ff8a5e;
      --metric-humidity: #2fd3c0;
      --metric-pressure: #9b8cff;

      --tone: #8fa3bf;
      --text: #eef4ff;
      --text-muted: #9fb2cc;

      /* glass surfaces */
      --glass-1: rgba(255, 255, 255, 0.055);
      --glass-2: rgba(255, 255, 255, 0.085);
      --glass-3: rgba(255, 255, 255, 0.13);
      --line: rgba(255, 255, 255, 0.14);
      --line-strong: rgba(255, 255, 255, 0.26);
      --highlight: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      --shadow-1: 0 10px 28px rgba(0, 0, 0, 0.34);
      --shadow-2: 0 18px 44px rgba(0, 0, 0, 0.42);
      --blur: 16px;

      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;

      /* motion */
      --dur-fast: 140ms;
      --dur-med: 240ms;
      --dur-slow: 330ms;
      --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }

    /* Author styles must not defeat the hidden attribute (e.g. display:flex). */
    [hidden] { display: none !important; }

    html, body { max-width: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(10px, 2.6vw, 26px);
      background:
        radial-gradient(120% 90% at 10% -10%, #16233c 0%, transparent 58%),
        radial-gradient(90% 70% at 100% 0%, rgba(124, 92, 255, 0.18) 0%, transparent 55%),
        radial-gradient(70% 60% at 50% 110%, rgba(47, 211, 192, 0.10) 0%, transparent 60%),
        linear-gradient(180deg, #0b1220 0%, #070c16 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(15px, 1.6vw, 17px);
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }

    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { display: block; width: 24px; height: 24px; color: inherit; }
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vw, 20px);
      min-width: 0;
    }

    /* ------------------------------------------------------- glass base */
    .glass {
      position: relative;
      background: linear-gradient(180deg, var(--glass-2), var(--glass-1));
      border: 1px solid var(--line);
      box-shadow: var(--highlight), var(--shadow-1);
      backdrop-filter: blur(var(--blur)) saturate(150%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
    }
    /* Layered inner highlight for depth. */
    .glass::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 38%);
      opacity: 0.7;
    }
    @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
      .glass {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: rgba(18, 28, 46, 0.94);
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      .glass { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(18, 28, 46, 0.94); }
    }

    /* ------------------------------------------------------------ header */
    .app__header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand__icon { color: #6fa8ff; flex: none; }
    .brand h1 {
      margin: 0;
      font-size: clamp(1rem, 2.4vw, 1.4rem);
      font-weight: 650;
      letter-spacing: 0.01em;
      overflow-wrap: anywhere;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      min-width: 0;
    }
    .connection__dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--state-error);
      box-shadow: 0 0 0 4px rgba(255, 107, 94, 0.16);
      flex: none;
      transition: background var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
    }
    .connection[data-state="ONLINE"] .connection__dot {
      background: var(--state-fresh);
      box-shadow: 0 0 0 4px rgba(67, 209, 158, 0.16);
    }
    .connection[data-state="ONLINE"] { animation: onlinePulse var(--dur-slow) var(--ease-out) 1; }
    @keyframes onlinePulse {
      0% { box-shadow: var(--highlight), 0 0 0 0 rgba(67, 209, 158, 0.35); }
      100% { box-shadow: var(--highlight), var(--shadow-1); }
    }
    .connection__label { font-weight: 700; letter-spacing: 0.05em; }
    .connection__meta { color: var(--text-muted); overflow-wrap: anywhere; }

    /* -------------------------------------------------------------- tabs */
    .tabs {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      min-width: 0;
    }
    .tabs__indicator {
      position: absolute;
      top: 0; left: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--glass-3), rgba(255, 255, 255, 0.05));
      border: 1px solid var(--line-strong);
      box-shadow: var(--highlight), 0 8px 20px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      transition: transform var(--dur-med) var(--ease-out), width var(--dur-med) var(--ease-out),
                  height var(--dur-med) var(--ease-out), opacity var(--dur-fast) linear;
      will-change: transform, width;
    }
    .tab {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: clamp(0.72rem, 2.8vw, 0.92rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: color var(--dur-med) var(--ease-out), background var(--dur-med) var(--ease-out),
                  transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
    }
    .tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22); transform: translateY(-1px); }
    .tab:active { transform: translateY(0) scale(0.97); transition-duration: 80ms; }
    .tab[aria-selected="true"] { color: var(--text); background: transparent; }
    .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* ------------------------------------------------------------ panels */
    .panels { min-width: 0; }
    .panel { min-width: 0; }
    .panel[hidden] { display: none; }
    .panel:not([hidden]) { animation: panelIn var(--dur-med) var(--ease-out) both; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(7px) scale(0.995); }
      to { opacity: 1; transform: none; }
    }

    .grid {
      display: grid;
      gap: clamp(10px, 1.8vw, 18px);
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      min-width: 0;
    }

    /* ------------------------------------------------------------- cards */
    .card {
      --tone: #8fa3bf;
      margin: 0;
      padding: clamp(13px, 2.2vw, 20px);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
      overflow: hidden;
      transition: opacity var(--dur-med) var(--ease-out), border-color var(--dur-med) var(--ease-out),
                  transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--highlight), var(--shadow-2); }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--tone), transparent);
      opacity: 0.85;
      transition: opacity var(--dur-med) var(--ease-out);
    }
    .card[data-data-state="STALE"] { opacity: 0.82; }
    .card[data-data-state="STALE"]::before { opacity: 0.5; }
    .card[data-data-state="ERROR"] { border-style: dashed; }

    .card__head { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
    .card__icon { color: var(--tone); flex: none; transition: color var(--dur-med) var(--ease-out); }
    .card__titles { min-width: 0; flex: 1 1 auto; }
    .card__title {
      margin: 0;
      font-size: clamp(0.88rem, 2.6vw, 0.98rem);
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .card__source {
      margin: 2px 0 0;
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge {
      flex: none;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid currentColor;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      transition: color var(--dur-med) var(--ease-out);
    }
    .badge[data-data-state="FRESH"] { color: var(--state-fresh); }
    .badge[data-data-state="STALE"] { color: var(--state-stale); }
    .badge[data-data-state="ERROR"] { color: var(--state-error); }

    .card__value {
      margin: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--tone);
      flex-wrap: wrap;
      min-width: 0;
    }
    .card__number {
      font-size: clamp(1.9rem, 10vw, 3.2rem);
      font-weight: 700;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      transition: color var(--dur-med) var(--ease-out);
    }
    .card__unit { font-size: clamp(0.9rem, 2.8vw, 1.2rem); font-weight: 600; color: var(--text-muted); }

    .card__foot {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 3px 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }
    .card__foot b { color: var(--text); font-weight: 600; }

    /* -------------------------------------------------- mode: horizontal */
    .hrows { display: flex; flex-direction: column; gap: clamp(10px, 1.8vw, 16px); min-width: 0; }
    .hrow {
      --tone: #8fa3bf;
      padding: clamp(12px, 2vw, 18px);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }
    .hrow__head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
    .hrow__label { font-weight: 650; font-size: 0.92rem; min-width: 0; overflow-wrap: anywhere; }
    .hrow__value {
      margin-left: auto;
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      color: var(--tone);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .hrow__value b { font-size: clamp(1.05rem, 4vw, 1.35rem); }
    .hrow__value i { font-style: normal; font-size: 0.8rem; color: var(--text-muted); }

    .track {
      position: relative;
      height: 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      min-width: 0;
    }
    .track__fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(143, 163, 191, 0.28), var(--tone));
      background: linear-gradient(90deg, color-mix(in srgb, var(--tone) 30%, transparent), var(--tone));
      transition: width var(--dur-slow) var(--ease-soft);
    }
    .track__knob {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 12px; height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 2px var(--tone), 0 2px 6px rgba(0, 0, 0, 0.45);
      transition: left var(--dur-slow) var(--ease-soft);
    }
    .track__tick {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.16);
    }
    .track[data-nodata="true"] .track__fill,
    .track[data-nodata="true"] .track__knob { display: none; }
    .track[data-nodata="true"]::after {
      content: var(--nodata-text, "no data");
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      color: var(--state-error);
    }
    .hrow__scale {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.68rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* -------------------------------------------------------- mode: bars */
    .barchart {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(8px, 1.6vw, 16px);
      min-width: 0;
    }
    .bcol {
      --tone: #8fa3bf;
      padding: clamp(9px, 1.6vw, 16px);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }
    .bcol__head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
    .bcol__head .card__title { font-size: clamp(0.7rem, 2.5vw, 0.86rem); }
    .bcol__head .card__icon .icon { width: 18px; height: 18px; }
    .bcol__plot {
      display: flex;
      gap: 5px;
      height: clamp(110px, 26vw, 190px);
      min-width: 0;
    }
    .bcol__axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: clamp(0.5rem, 2vw, 0.66rem);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }
    .bcol__track {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background:
        repeating-linear-gradient(to top, rgba(255, 255, 255, 0.09) 0 1px, transparent 1px 25%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    .bcol__bar {
      width: 100%;
      height: 0%;
      border-radius: var(--radius-sm) var(--radius-sm) 2px 2px;
      background: linear-gradient(180deg, var(--tone), rgba(143, 163, 191, 0.28));
      background: linear-gradient(180deg, var(--tone), color-mix(in srgb, var(--tone) 35%, transparent));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: height var(--dur-slow) var(--ease-soft);
    }
    .bcol__track[data-nodata="true"] .bcol__bar { display: none; }
    .bcol__track[data-nodata="true"]::after {
      content: "—";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--state-error);
    }
    .bcol__value {
      display: flex;
      align-items: baseline;
      gap: 4px;
      color: var(--tone);
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
      min-width: 0;
    }
    .bcol__value b { font-size: clamp(0.9rem, 3.4vw, 1.25rem); }
    .bcol__value i { font-style: normal; font-size: 0.7rem; color: var(--text-muted); }
    .bcol__range { font-size: 0.6rem; color: var(--text-muted); overflow-wrap: anywhere; }

    /* ------------------------------------------------------ mode: gauges */
    .gauges {
      display: grid;
      gap: clamp(10px, 1.8vw, 18px);
      grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
      min-width: 0;
    }
    .gauge { align-items: center; text-align: center; }
    .gauge__svg { width: 100%; max-width: 210px; height: auto; display: block; margin: 0 auto; }
    .gauge__track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 10;
      stroke-linecap: round;
    }
    .gauge__progress {
      fill: none;
      stroke: var(--tone);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dasharray var(--dur-slow) var(--ease-soft), stroke var(--dur-med) var(--ease-out);
    }
    .gauge[data-nodata="true"] .gauge__progress { display: none; }
    .gauge__icon { color: var(--tone); }
    .gauge__value {
      fill: var(--tone);
      font-size: 26px;
      font-weight: 700;
      text-anchor: middle;
      font-variant-numeric: tabular-nums;
      transition: fill var(--dur-med) var(--ease-out);
    }
    .gauge__unit { fill: var(--text-muted); font-size: 11px; text-anchor: middle; font-weight: 600; }
    .gauge[data-nodata="true"] .gauge__value { fill: var(--state-error); }
    .gauge__meta {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      min-width: 0;
    }
    .gauge__scale { font-size: 0.68rem; color: var(--text-muted); margin: 0; overflow-wrap: anywhere; }

    /* ---------------------------------------------------- mode: history */
    .history {
      --tone: #8fa3bf;
      padding: clamp(12px, 2vw, 20px);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.6vw, 16px);
      min-width: 0;
    }
    .history__head {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: flex-end;
      justify-content: space-between;
      min-width: 0;
    }
    .history__title h2 {
      margin: 0;
      font-size: clamp(0.95rem, 2.6vw, 1.1rem);
      font-weight: 650;
    }
    .history__sub {
      margin: 2px 0 0;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .history__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .history__select {
      appearance: none;
      -webkit-appearance: none;
      padding: 9px 30px 9px 12px;
      min-height: 38px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background:
        linear-gradient(180deg, var(--glass-3), rgba(255, 255, 255, 0.05)),
        linear-gradient(45deg, transparent 50%, var(--text-muted) 50%) calc(100% - 16px) 50% / 6px 6px no-repeat,
        linear-gradient(135deg, var(--text-muted) 50%, transparent 50%) calc(100% - 11px) 50% / 6px 6px no-repeat;
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: box-shadow var(--dur-med) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .history__select:hover { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28), var(--highlight); transform: translateY(-1px); }
    .history__select:active { transform: translateY(0) scale(0.99); }
    .history__select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .history__select option { background: #101a2c; color: var(--text); }

    .btn {
      min-height: 38px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, var(--glass-2), rgba(255, 255, 255, 0.04));
      color: var(--text);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--dur-med) var(--ease-out), transform var(--dur-fast) var(--ease-out),
                  box-shadow var(--dur-med) var(--ease-out), color var(--dur-med) var(--ease-out);
    }
    .btn:hover { background: linear-gradient(180deg, var(--glass-3), rgba(255, 255, 255, 0.06)); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28); transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.97); transition-duration: 80ms; }
    .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .btn[data-armed="true"] {
      color: var(--state-error);
      border-color: currentColor;
      box-shadow: 0 0 0 1px rgba(255, 107, 94, 0.25), 0 8px 22px rgba(255, 107, 94, 0.18);
    }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .chip {
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--dur-med) var(--ease-out), color var(--dur-med) var(--ease-out),
                  transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
    }
    .chip:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); transform: translateY(-1px); }
    .chip:active { transform: translateY(0) scale(0.96); transition-duration: 80ms; }
    .chip[aria-pressed="true"] {
      color: var(--text);
      background: linear-gradient(180deg, var(--glass-3), rgba(255, 255, 255, 0.05));
      border-color: var(--line-strong);
      box-shadow: var(--highlight), 0 6px 16px rgba(0, 0, 0, 0.26);
    }
    .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .history__hint {
      margin: 0;
      font-size: 0.72rem;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }

    .chart {
      position: relative;
      min-width: 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01));
      padding: 6px;
      touch-action: pan-y;
    }
    .chart:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .chart__svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart__lane-frame { fill: none; stroke: rgba(255, 255, 255, 0.10); stroke-width: 1; }
    .chart__grid { stroke: rgba(255, 255, 255, 0.09); stroke-width: 1; }
    .chart__grid--v { stroke-dasharray: 2 4; }
    .chart__ylist { font-size: 10px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
    .chart__xlist { font-size: 10px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
    .chart__lane-label { font-size: 11px; fill: var(--text); font-weight: 600; }
    .chart__line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .chart__line[data-metric="temperature"] { stroke: var(--metric-temperature); }
    .chart__line[data-metric="humidity"] { stroke: var(--metric-humidity); }
    .chart__line[data-metric="pressure"] { stroke: var(--metric-pressure); }
    /* State never replaces the metric colour: it only adds opacity/dash. */
    .chart__line[data-state="STALE"] { opacity: 0.62; stroke-dasharray: 5 4; }
    .chart__line[data-state="ERROR"] { opacity: 0.42; stroke-dasharray: 2 5; }
    .chart__line { transition: opacity var(--dur-med) var(--ease-out); }
    .chart__dot { stroke: none; }
    .chart__dot[data-state="STALE"] { fill: var(--state-stale); }
    .chart__dot[data-state="ERROR"] { fill: var(--state-error); }
    .chart__current { transition: cx var(--dur-slow) var(--ease-soft), cy var(--dur-slow) var(--ease-soft); }
    .chart__cursor { stroke: rgba(255, 255, 255, 0.5); stroke-width: 1; stroke-dasharray: 3 3; }
    .chart__cursor-dot { fill: #fff; stroke-width: 2; }
    .chart__empty {
      margin: 0;
      padding: clamp(18px, 6vw, 42px) 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .chart__empty b { color: var(--text); font-size: 1rem; }
    .chart__empty span { font-size: 0.76rem; }

    .chart__tooltip {
      position: absolute;
      z-index: 3;
      min-width: 148px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line-strong);
      background: rgba(14, 22, 36, 0.86);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      box-shadow: var(--highlight), var(--shadow-2);
      font-size: 0.76rem;
      pointer-events: none;
      transition: opacity var(--dur-fast) linear;
    }
    .chart__tooltip[hidden] { display: none; }
    .chart__tooltip b { font-variant-numeric: tabular-nums; }
    .tt__time { color: var(--text-muted); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
    .tt__row { display: flex; align-items: center; gap: 7px; }
    .tt__row + .tt__row { margin-top: 3px; }
    .tt__row .icon { width: 14px; height: 14px; }
    .tt__row[data-metric="temperature"] { color: var(--metric-temperature); }
    .tt__row[data-metric="humidity"] { color: var(--metric-humidity); }
    .tt__row[data-metric="pressure"] { color: var(--metric-pressure); }
    .tt__value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .tt__unit { color: var(--text-muted); font-size: 0.7rem; }
    .tt__state { margin-left: auto; font-size: 0.62rem; letter-spacing: 0.05em; }
    .tt__state[data-data-state="FRESH"] { color: var(--state-fresh); }
    .tt__state[data-data-state="STALE"] { color: var(--state-stale); }
    .tt__state[data-data-state="ERROR"] { color: var(--state-error); }

    .history__table { margin: 0; }
    .history__table table { border-collapse: collapse; width: 100%; }
    .history__table th, .history__table td { text-align: left; padding: 2px 6px; }

    /* ------------------------------------------------------------ footer */
    .app__footer {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 16px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }
    .app__footer b { color: var(--text); font-weight: 600; }
    /* ---------------------------------------------------------------- */
    /* Language selection: the first screen on every start. The dashboard  */
    /* stays hidden until a language is chosen (no persistence).           */
    /* ---------------------------------------------------------------- */
    .langscreen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(120% 120% at 20% 0%, #16233c 0%, #0b1220 55%, #070c16 100%);
      z-index: 40;
    }

    .langscreen[hidden] { display: none; }

    .langscreen__panel {
      width: min(420px, 100%);
      padding: 22px 20px 18px;
      display: grid;
      gap: 10px;
      text-align: center;
      animation: langscreen-in 240ms ease-out both;
    }

    @keyframes langscreen-in {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .langscreen__panel { animation-duration: 1ms; }
    }

    .langscreen__title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: 0.2px;
      color: var(--text, #eef4ff);
    }

    .langscreen__instruction {
      margin: 0 0 6px;
      font-size: 0.95rem;
      color: var(--muted, #9fb2cc);
    }

    .langbutton {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      padding: 0 18px;
      border-radius: 14px;
      border: 1px solid rgba(67, 209, 158, 0.55);
      background: linear-gradient(120deg, rgba(47, 211, 192, 0.22), rgba(67, 209, 158, 0.14));
      color: var(--text, #eef4ff);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .langbutton__code {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: rgba(238, 244, 255, 0.6);
      text-transform: uppercase;
    }

    .langbutton:hover,
    .langbutton:focus-visible {
      background: linear-gradient(120deg, rgba(47, 211, 192, 0.34), rgba(67, 209, 158, 0.22));
      box-shadow: 0 10px 26px rgba(47, 211, 192, 0.22), 0 0 0 1px rgba(67, 209, 158, 0.5) inset;
      outline: none;
    }

    .langbutton:active { transform: translateY(1px); }

    .langscreen__hint {
      margin: 4px 0 0;
      font-size: 0.8rem;
      line-height: 1.35;
      color: rgba(159, 178, 204, 0.85);
    }

    .app[hidden] { display: none; }

    .note { margin: 0; font-size: 0.74rem; color: var(--text-muted); overflow-wrap: anywhere; }

    @media (max-width: 380px) {
      .card__number { font-size: 1.9rem; }
      .connection { width: 100%; justify-content: center; }
      .bcol { padding: 8px; }
      .history__actions { width: 100%; }
      .history__select, .btn { flex: 1 1 auto; }
    }

    /* ------------------------------------------------------------------
       THE role -> appearance mapping. JavaScript only ever sets
       data-tone="<role id>"; every colour decision lives here.
       ------------------------------------------------------------------ */
    [data-tone="temp-cold"] { --tone: var(--role-temp-cold); }
    [data-tone="temp-comfort"] { --tone: var(--role-temp-comfort); }
    [data-tone="temp-hot"] { --tone: var(--role-temp-hot); }
    [data-tone="humidity-low"] { --tone: var(--role-humidity-low); }
    [data-tone="humidity-comfort"] { --tone: var(--role-humidity-comfort); }
    [data-tone="humidity-high"] { --tone: var(--role-humidity-high); }
    [data-tone="pressure-low"] { --tone: var(--role-pressure-low); }
    [data-tone="pressure-normal"] { --tone: var(--role-pressure-normal); }
    [data-tone="pressure-high"] { --tone: var(--role-pressure-high); }

    /* Motion preferences: no animations, no tweens, no long transitions. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .tabs__indicator { transition: none !important; }
      .card:hover { transform: none; }
      .tab:hover, .chip:hover, .btn:hover { transform: none; }
    }
  </style>
</head>

  <main class="app" id="app-shell" hidden>

    <nav class="tabs glass" role="tablist" aria-label="Mode" data-i18n-aria="tablist_aria" id="tabs">

          'responses — there is no separate request or timer. Changing the period rebuilds the buffer.',

        step: 'step',

    };

    function textLocale() { return activeLocale || DEFAULT_TEXT_LOCALE; }

    function t(key) {

    /* =====================================================================
       Layer 1 — configuration. All thresholds, ranges, intervals and history

       ===================================================================== */
    const APP_CONFIG = {
      apiPath: '/api/weather',
      pollIntervalMs: 1500,
      pollIntervalHiddenMs: 5000,
      requestTimeoutMs: 3500,
      freshnessMaxAgeMs: { temperature: 15000, humidity: 7500, pressure: 15000 },

    const METRIC_CONFIG = {
      temperature: {

        range: { min: -10, max: 40 }, ticks: [-10, 0, 10, 20, 30, 40], decimals: 1
      },
      humidity: {
        key: 'humidity', label: '', unit: '%', source: 'DHT11', icon: 'i-humidity',

      pressure: {

        { id: '5m', label: '', retentionMs: 300 * 1000, sampleMs: 5000, maxPoints: 64 },
        { id: '15m', label: '', retentionMs: 900 * 1000, sampleMs: 10000, maxPoints: 94 },
        { id: '30m', label: '', retentionMs: 1800 * 1000, sampleMs: 15000, maxPoints: 124 },
        { id: '1h', label: '', retentionMs: 3600 * 1000, sampleMs: 30000, maxPoints: 124 },
        { id: '3h', label: '', retentionMs: 3 * 3600 * 1000, sampleMs: 60000, maxPoints: 184 },
        { id: '6h', label: '', retentionMs: 6 * 3600 * 1000, sampleMs: 120000, maxPoints: 184 },
        { id: '12h', label: '', retentionMs: 12 * 3600 * 1000, sampleMs: 300000, maxPoints: 148 },

    const METRIC_KEYS = ['temperature', 'humidity', 'pressure'];
    const MODES = ['numeric', 'horizontal', 'bars', 'gauges', 'history'];
    const DEFAULT_MODE = 'numeric';

    const DATA_STATES = { FRESH: 'FRESH', STALE: 'STALE', ERROR: 'ERROR' };
    const CONNECTION_STATES = { ONLINE: 'ONLINE', OFFLINE: 'OFFLINE' };
    const STATE_CODES = { FRESH: 0, STALE: 1, ERROR: 2 };
    const STATE_BY_CODE = ['FRESH', 'STALE', 'ERROR'];

      humidityComfort: 'humidity-comfort',
      humidityHigh: 'humidity-high',

    const GAUGE_GEOMETRY = { radius: 52, cx: 60, cy: 60, sweepFraction: 0.75 };
    const HISTORY_CHART = { laneHeights: { small: 84, medium: 96, large: 108 }, poolDots: 12 };

    /* =====================================================================
       Layer 2 — UI state (single source of truth) + bounded history ring.
       ===================================================================== */
    const uiState = {
      connection: CONNECTION_STATES.OFFLINE,
      weather: null,
      uiModel: null,
      activeMode: DEFAULT_MODE,
      lastSuccessAt: null,
      lastErrorAt: null,
      lastErrorMessage: '',

    const history = {
      capacity: 0,
      count: 0,
      start: 0,
      time: null,
      temperature: null,
      humidity: null,
      pressure: null,
      temperatureState: null,
      humidityState: null,
      pressureState: null,

    const dom = { tabs: [], panelsByMode: {}, panelRoots: {}, refs: {} };

    /* =====================================================================
       Layer 3 — API access. Only GET /api/weather; no HTML generation here.
       ===================================================================== */
    async function fetchWeather(options) {
      const settings = options || {};
      const timeoutMs = settings.timeoutMs || APP_CONFIG.requestTimeoutMs;
      const supportsAbort = typeof AbortController === 'function';
      const controller = supportsAbort ? new AbortController() : null;
      const timer = controller ? setTimeout(function () { controller.abort(); }, timeoutMs) : null;

      try {
        const response = await fetch(APP_CONFIG.apiPath, {
          method: 'GET',
          cache: 'no-store',
          headers: { Accept: 'application/json' },
          signal: controller ? controller.signal : undefined
        });

        if (!response || !response.ok) {
          throw new Error('HTTP ' + (response ? response.status : '?'));
        }

        try {
          return await response.json();
        } catch (parseError) {
          throw new Error('invalid JSON (' + (parseError && parseError.message ? parseError.message : 'parse error') + ')');
        }
      } finally {
        if (timer !== null) { clearTimeout(timer); }
      }
    }

    function asFiniteNumber(value) {
      return (typeof value === 'number' && isFinite(value)) ? value : null;
    }

    function asNonNegativeNumber(value) {
      const number = asFiniteNumber(value);
      return (number === null || number < 0) ? null : number;
    }

    function normalizeWeather(raw) {
      if (!raw || typeof raw !== 'object') {
        throw new Error('payload is not a JSON object');
      }

      const bmpValid = raw.bmp280_valid === true;
      const dhtValid = raw.dht11_valid === true;
      const pressurePa = asFiniteNumber(raw.pressure_pa);
      const pressureHpa = asFiniteNumber(raw.pressure_hpa);

      return {
        temperature: {
          value: asFiniteNumber(raw.temperature_c),   // BMP280 only
          valid: bmpValid,
          ageMs: asNonNegativeNumber(raw.bmp280_age_ms),
          source: 'BMP280'
        },
        humidity: {
          value: asFiniteNumber(raw.humidity_pct),    // DHT11 only
          valid: dhtValid,
          ageMs: asNonNegativeNumber(raw.dht11_age_ms),
          source: 'DHT11'
        },
        pressure: {
          value: pressureHpa !== null ? pressureHpa : (pressurePa !== null ? pressurePa / 100 : null),
          valuePa: pressurePa,
          valid: bmpValid,
          ageMs: asNonNegativeNumber(raw.bmp280_age_ms),
          source: 'BMP280'
        },
        uptimeMs: asNonNegativeNumber(raw.uptime_ms)
      };
    }

    /* =====================================================================
       Layer 4 — semantic layer: pure functions, no DOM, no CSS.
       ===================================================================== */
    function classifyDataState(reading, maxAgeMs, context) {
      const offline = !!(context && context.offline);
      if (!reading || reading.value === null || !isFinite(reading.value)) {
        return DATA_STATES.ERROR;
      }
      if (!reading.valid) {
        return DATA_STATES.STALE;
      }
      if (maxAgeMs !== null && maxAgeMs !== undefined &&
          reading.ageMs !== null && reading.ageMs > maxAgeMs) {
        return DATA_STATES.STALE;
      }
      if (offline) {
        return DATA_STATES.STALE;
      }
      return DATA_STATES.FRESH;
    }

    function getTemperatureState(reading, context) {
      const value = (reading && reading.value !== null) ? reading.value : null;
      let colorRole = null;
      if (value !== null) {
        const limits = SEMANTIC_THRESHOLDS.temperature;
        colorRole = value < limits.coldBelowC ? COLOR_ROLES.tempCold
          : value > limits.hotAboveC ? COLOR_ROLES.tempHot
            : COLOR_ROLES.tempComfort;
      }
      return {
        metric: 'temperature', label: 'Температура', source: 'BMP280', unit: '°C',
        value: value,
        ageMs: reading ? reading.ageMs : null,
        valid: !!(reading && reading.valid),
        dataState: classifyDataState(reading, APP_CONFIG.freshnessMaxAgeMs.temperature, context),
        colorRole: colorRole
      };
    }

    function getHumidityState(reading, context) {
      const value = (reading && reading.value !== null) ? reading.value : null;
      let colorRole = null;
      if (value !== null) {
        const limits = SEMANTIC_THRESHOLDS.humidity;
        colorRole = value < limits.lowBelowPct ? COLOR_ROLES.humidityLow
          : value > limits.highAbovePct ? COLOR_ROLES.humidityHigh
            : COLOR_ROLES.humidityComfort;
      }
      return {
        metric: 'humidity', label: 'Влажность', source: 'DHT11', unit: '%',
        value: value,
        ageMs: reading ? reading.ageMs : null,
        valid: !!(reading && reading.valid),
        dataState: classifyDataState(reading, APP_CONFIG.freshnessMaxAgeMs.humidity, context),
        colorRole: colorRole
      };
    }

    function getPressureState(reading, context) {
      const value = (reading && reading.value !== null) ? reading.value : null;
      let colorRole = null;
      if (value !== null) {
        const limits = SEMANTIC_THRESHOLDS.pressure;
        colorRole = value < limits.lowBelowHpa ? COLOR_ROLES.pressureLow
          : value > limits.highAboveHpa ? COLOR_ROLES.pressureHigh
            : COLOR_ROLES.pressureNormal;
      }
      return {
        metric: 'pressure', label: 'Давление', source: 'BMP280', unit: 'hPa',
        value: value,
        valuePa: (reading && reading.valuePa !== null && reading.valuePa !== undefined) ? reading.valuePa : null,
        ageMs: reading ? reading.ageMs : null,
        valid: !!(reading && reading.valid),
        dataState: classifyDataState(reading, APP_CONFIG.freshnessMaxAgeMs.pressure, context),
        colorRole: colorRole
      };
    }

    function getMetricState(metricKey, reading, context) {
      if (metricKey === 'temperature') { return getTemperatureState(reading, context); }
      if (metricKey === 'humidity') { return getHumidityState(reading, context); }
      return getPressureState(reading, context);
    }

    /* =====================================================================
       Layer 5 — UI model: the only thing renderers consume.
       ===================================================================== */
    function normalizeToRange(value, range) {
      if (value === null || value === undefined || !isFinite(value)) { return null; }
      if (!range || range.max <= range.min) { return null; }
      const fraction = (value - range.min) / (range.max - range.min);
      return Math.min(1, Math.max(0, fraction));
    }

    function formatAge(ageMs) {
      if (ageMs === null || ageMs === undefined || !isFinite(ageMs)) { return t('no_data'); }
      if (ageMs < 1000) { return Math.round(ageMs) + ' ' + t('milliseconds'); }
      if (ageMs < 60000) { return (ageMs / 1000).toFixed(1) + ' ' + t('seconds'); }
      const minutes = Math.floor(ageMs / 60000);
      const seconds = Math.round((ageMs % 60000) / 1000);
      return minutes + ' ' + t('minutes') + ' ' + seconds + ' ' + t('seconds');
    }

    function formatMetricValue(state) {
      if (state.value === null || !isFinite(state.value)) { return '—'; }
      const config = METRIC_CONFIG[state.metric];
      const decimals = config ? config.decimals : 1;
      return state.value.toFixed(decimals);
    }

    function formatDuration(ms) {
      if (ms === null || !isFinite(ms)) { return '—'; }
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) { return hours + ' ' + t('hours') + ' ' + minutes + ' ' + t('minutes') + ' ' + seconds + ' ' + t('seconds'); }
      if (minutes > 0) { return minutes + ' ' + t('minutes') + ' ' + seconds + ' ' + t('seconds'); }
      return seconds + ' ' + t('seconds');
    }

    function formatDurationShort(ms) {
      if (ms < 60 * 1000) { return Math.round(ms / 1000) + ' ' + t('seconds'); }
      if (ms < 3600 * 1000) { return Math.round(ms / 60000) + ' ' + t('minutes'); }
      return Math.round(ms / 3600000) + ' ' + t('hours');
    }

    function formatClock(timestampMs, withSeconds) {
      const date = new Date(timestampMs);
      const pad = function (value) { return (value < 10 ? '0' : '') + value; };
      const base = pad(date.getHours()) + ':' + pad(date.getMinutes());
      return withSeconds ? base + ':' + pad(date.getSeconds()) : base;
    }

    function worstDataState(metrics) {
      const order = [DATA_STATES.FRESH, DATA_STATES.STALE, DATA_STATES.ERROR];
      let worst = DATA_STATES.FRESH;
      metrics.forEach(function (metric) {
        if (order.indexOf(metric.dataState) > order.indexOf(worst)) { worst = metric.dataState; }
      });
      return worst;
    }

    function buildUiModel() {
      const normalized = uiState.weather;
      const offline = uiState.connection === CONNECTION_STATES.OFFLINE;
      const elapsedSinceSuccess = (offline && uiState.lastSuccessAt !== null)
        ? (Date.now() - uiState.lastSuccessAt) : 0;
      const context = { offline: offline };

      const metrics = METRIC_KEYS.map(function (key) {
        const config = METRIC_CONFIG[key];
        const reading = normalized ? normalized[key] : null;
        const adjusted = reading ? {
          value: reading.value,
          valid: reading.valid,
          valuePa: reading.valuePa,
          ageMs: reading.ageMs === null ? null : reading.ageMs + elapsedSinceSuccess

        const state = getMetricState(key, adjusted, context);
        const fraction = normalizeToRange(state.value, config.range);

        return {
          key: key,
          label: config.label,
          unit: config.unit,
          source: config.source,
          icon: config.icon,
          range: config.range,
          ticks: config.ticks,
          decimals: config.decimals,
          value: state.value,
          display: formatMetricValue(state),
          fraction: fraction,
          hasData: fraction !== null,
          dataState: state.dataState,
          colorRole: state.colorRole,
          valid: state.valid,
          ageMs: state.ageMs,
          ageEstimated: !!state.ageEstimated,
          ageText: (state.ageEstimated ? '~' : '') + formatAge(state.ageMs),
          rangeText: config.range.min + '…' + config.range.max + ' ' + config.unit
