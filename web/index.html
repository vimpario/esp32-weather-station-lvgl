      });

      const byKey = {};
      metrics.forEach(function (metric) { byKey[metric.key] = metric; });

      return {
        metrics: metrics,
        byKey: byKey,
        uptimeMs: normalized ? normalized.uptimeMs : null,
        connection: uiState.connection,
        lastSuccessAt: uiState.lastSuccessAt,
        activeMode: uiState.activeMode,
        worstState: worstDataState(metrics)
      };
    }

    /* =====================================================================
       Layer 6 — history: collection, retention, trimming, sampling, series.
       Client-side only: history never leaves the page and is never persisted.
       ===================================================================== */
    function historyPreset(presetId) {
      for (let i = 0; i < HISTORY_CONFIG.presets.length; i += 1) {
        if (HISTORY_CONFIG.presets[i].id === presetId) { return HISTORY_CONFIG.presets[i]; }
      }
      for (let i = 0; i < HISTORY_CONFIG.presets.length; i += 1) {
        if (HISTORY_CONFIG.presets[i].id === HISTORY_CONFIG.defaultPresetId) {
          return HISTORY_CONFIG.presets[i];
        }
      }
      return HISTORY_CONFIG.presets[0];
    }

    function activeHistoryPreset() { return historyPreset(uiState.historyPresetId); }

    function allocateHistory(capacity) {
      history.capacity = capacity;
      history.start = 0;
      history.count = 0;
      history.time = new Float64Array(capacity);
      history.temperature = new Float32Array(capacity);
      history.humidity = new Float32Array(capacity);
      history.pressure = new Float32Array(capacity);
      history.temperatureState = new Uint8Array(capacity);
      history.humidityState = new Uint8Array(capacity);
      history.pressureState = new Uint8Array(capacity);
    }

    // Switching retention keeps the same single store: the ring is re-sized and
    // old samples are re-thinned into it instead of being duplicated.
    function historyConfigure(presetId, nowMs) {
      const preset = historyPreset(presetId);
      const now = (typeof nowMs === 'number') ? nowMs : Date.now();
      const capacity = Math.min(HISTORY_CONFIG.hardMaxPoints, Math.max(2, preset.maxPoints));

      const carried = [];
      const windowStart = now - preset.retentionMs;
      for (let i = 0; i < history.count; i += 1) {
        const index = (history.start + i) % history.capacity;
        const stamp = history.time[index];
        if (stamp >= windowStart) {
          carried.push({
            time: stamp,
            temperature: history.temperature[index],
            humidity: history.humidity[index],
            pressure: history.pressure[index],
            temperatureState: history.temperatureState[index],
            humidityState: history.humidityState[index],
            pressureState: history.pressureState[index]
          });
        }
      }

      uiState.historyPresetId = preset.id;
      allocateHistory(capacity);

      // Re-thin to the new sampling interval so a longer preset cannot keep a
      // denser trail than its own sampleMs allows.
      let lastKept = -Infinity;
      for (let i = 0; i < carried.length; i += 1) {
        const sample = carried[i];
        if (sample.time - lastKept < preset.sampleMs && i < carried.length - 1) { continue; }
        historyPush(sample);
        lastKept = sample.time;
      }
      history.lastSampleAt = history.count > 0 ? history.time[(history.start + history.count - 1) % capacity] : 0;
      return preset;
    }

    function historyPush(sample) {
      if (history.capacity === 0) { return; }
      if (history.count === history.capacity) {
        history.start = (history.start + 1) % history.capacity;
        history.count -= 1;
      }
      const index = (history.start + history.count) % history.capacity;
      history.time[index] = sample.time;
      history.temperature[index] = sample.temperature;
      history.humidity[index] = sample.humidity;
      history.pressure[index] = sample.pressure;
      history.temperatureState[index] = sample.temperatureState;
      history.humidityState[index] = sample.humidityState;
      history.pressureState[index] = sample.pressureState;
      history.count += 1;
    }

    function historySampleAt(index) {
      if (index < 0 || index >= history.count) { return null; }
      const slot = (history.start + index) % history.capacity;
      return {
        time: history.time[slot],
        temperature: history.temperature[slot],
        humidity: history.humidity[slot],
        pressure: history.pressure[slot],
        temperatureState: STATE_BY_CODE[history.temperatureState[slot]] || DATA_STATES.ERROR,
        humidityState: STATE_BY_CODE[history.humidityState[slot]] || DATA_STATES.ERROR,
        pressureState: STATE_BY_CODE[history.pressureState[slot]] || DATA_STATES.ERROR
      };
    }

    function historyMetricValue(sample, metricKey) {
      if (!sample) { return null; }
      const value = sample[metricKey];
      return (typeof value === 'number' && isFinite(value)) ? value : null;
    }

    function historyMetricState(sample, metricKey) {
      if (!sample) { return DATA_STATES.ERROR; }
      return sample[metricKey + 'State'] || DATA_STATES.ERROR;
    }

    // Decides whether this poll becomes a history point (adaptive sampling).
    function sampleHistory(normalized, nowMs) {
      const preset = activeHistoryPreset();
      if (history.count > 0 && nowMs - history.lastSampleAt < preset.sampleMs) {
        return false;
      }
      const stamp = history.count > 0 ? Math.max(nowMs, history.lastSampleAt + 1) : nowMs;
      const context = { offline: false };

      const states = {
        temperature: getTemperatureState(normalized.temperature, context).dataState,
        humidity: getHumidityState(normalized.humidity, context).dataState,
        pressure: getPressureState(normalized.pressure, context).dataState
      };
      const toStored = function (value) {
        return (value === null || !isFinite(value)) ? NaN : value;  // null stays null
      };

      historyPush({
        time: stamp,
        temperature: toStored(normalized.temperature.value),
        humidity: toStored(normalized.humidity.value),
        pressure: toStored(normalized.pressure.value),
        temperatureState: STATE_CODES[states.temperature],
        humidityState: STATE_CODES[states.humidity],
        pressureState: STATE_CODES[states.pressure]
      });
      history.lastSampleAt = stamp;
      history.totalSamples += 1;
      return true;
    }

    function trimHistory(nowMs) {
      const preset = activeHistoryPreset();
      const windowStart = nowMs - preset.retentionMs;
      let dropped = 0;
      // The ring is time-ordered, so trimming the front is enough.
      while (history.count > 0) {
        const oldest = history.time[history.start];
        if (oldest < windowStart) {
          history.start = (history.start + 1) % history.capacity;
          history.count -= 1;
          dropped += 1;
        } else { break; }
      }
      return dropped;
    }

    // Entry point called from the single polling cycle (no second timer).
    function updateHistory(normalized, nowMs) {
      const now = (typeof nowMs === 'number') ? nowMs : Date.now();
      const added = sampleHistory(normalized, now);
      trimHistory(now);
      return added;
    }

    function resetHistory() {
      history.start = 0;
      history.count = 0;
      history.lastSampleAt = 0;
      history.totalSamples = 0;
      uiState.hoverIndex = -1;
    }

    function historyRetentionMs() { return activeHistoryPreset().retentionMs; }

    // Aggregates the visible window into per-metric series with their own Y scale.
    function buildHistorySeries(nowMs, options) {
      const settings = options || {};
      const preset = activeHistoryPreset();
      const now = (typeof nowMs === 'number') ? nowMs : Date.now();
      const tMax = settings.tMax === undefined ? now : settings.tMax;
      const tMin = settings.tMin === undefined ? (tMax - preset.retentionMs) : settings.tMin;
      const gapMs = preset.sampleMs * HISTORY_CONFIG.gapFactor;
      const withSeconds = (tMax - tMin) <= HISTORY_CONFIG.secondsInAxisBelowMs;

      const visible = [];
      for (let i = 0; i < history.count; i += 1) {
        const sample = historySampleAt(i);
        if (sample.time < tMin || sample.time > tMax) { continue; }
        visible.push(sample);
      }

      const series = { tMin: tMin, tMax: tMax, count: visible.length, total: history.totalSamples, withSeconds: withSeconds, metrics: {} };

      METRIC_KEYS.forEach(function (key) {
        const points = [];
        let min = null;
        let max = null;
        let latest = null;
        let previousTime = null;
        let segmentIndex = -1;
        let segmentCounter = 0;

        visible.forEach(function (sample) {
          const value = historyMetricValue(sample, key);
          const state = historyMetricState(sample, key);
          const gap = previousTime !== null && (sample.time - previousTime) > gapMs;
          previousTime = sample.time;

          if (value === null) {
            segmentIndex = -1;                       // missing data breaks the line
            points.push({ time: sample.time, value: null, state: state, segment: -1 });
            return;
          }
          // A new segment id is handed out for every gap, so the drawn path never
          // connects across missing samples or long offline stretches.
          if (gap || segmentIndex < 0) { segmentIndex = segmentCounter; segmentCounter += 1; }
          if (min === null || value < min) { min = value; }
          if (max === null || value > max) { max = value; }
          latest = value;
          points.push({ time: sample.time, value: value, state: state, segment: segmentIndex });
        });

        const range = historyYRange(key, min, max);
        series.metrics[key] = {
          key: key,
          points: points,
          min: min,
          max: max,
          latest: latest,
          yMin: range.min,
          yMax: range.max,
          yTicks: range.ticks,
          drawn: downsampledPoints(points, HISTORY_CONFIG.maxRenderPoints),
          hasData: points.length > 0
        };
      });

      series.xTicks = buildTimeTicks(tMin, tMax);
      return series;
    }

    function historyYRange(metricKey, min, max) {
      const config = HISTORY_CONFIG.yRanges[metricKey];
      if (config.mode === 'fixed') {
        return { min: config.min, max: config.max, ticks: [config.max, (config.max + config.min) / 2, config.min] };
      }
      let low = (min === null) ? null : min;
      let high = (max === null) ? null : max;
      if (low === null || high === null) {
        // No data yet: fall back to the presentation range, never a fake 0..N.
        const fallback = METRIC_CONFIG[metricKey].range;
        low = fallback.min;
        high = fallback.max;
      }
      let span = high - low;
      if (span < config.minSpan) {
        const centre = (high + low) / 2;
        low = centre - config.minSpan / 2;
        high = centre + config.minSpan / 2;
        span = high - low;
      }
      const padding = span * config.paddingRatio;
      low -= padding;
      high += padding;
      if (low < config.absoluteMin) { low = config.absoluteMin; }
      if (high > config.absoluteMax) { high = config.absoluteMax; }
      const decimals = METRIC_CONFIG[metricKey].decimals;
      return {
        min: low,
        max: high,
        ticks: [high, (high + low) / 2, low].map(function (value) {
          return Number(value.toFixed(decimals === 0 ? 0 : 1));
        })
      };
    }

    // Rendering must not grow with the sample count: keep the extremes per bucket
    // so peaks survive while the SVG stays small.
    function downsampledPoints(points, limit) {
      const drawn = [];
      points.forEach(function (point) { if (point.value !== null) { drawn.push(point); } });
      if (drawn.length <= limit) { return drawn; }

      const buckets = Math.max(1, Math.floor(limit / 2));
      const result = [];
      const size = drawn.length / buckets;
      for (let b = 0; b < buckets; b += 1) {
        const from = Math.floor(b * size);
        const to = Math.min(drawn.length, Math.floor((b + 1) * size));
        if (to <= from) { continue; }
        let minPoint = drawn[from];
        let maxPoint = drawn[from];
        for (let i = from; i < to; i += 1) {
          if (drawn[i].value < minPoint.value) { minPoint = drawn[i]; }
          if (drawn[i].value > maxPoint.value) { maxPoint = drawn[i]; }
        }
        const first = minPoint.time <= maxPoint.time ? minPoint : maxPoint;
        const second = first === minPoint ? maxPoint : minPoint;
        result.push(first);
        if (second !== first) { result.push(second); }
      }
      return result;
    }

    function buildTimeTicks(tMin, tMax) {
      const ticks = [];
      const count = HISTORY_CONFIG.axisTicks;
      for (let i = 0; i < count; i += 1) {
        ticks.push(tMin + ((tMax - tMin) * i) / (count - 1));
      }
      return ticks;
    }

    /* =====================================================================
       Layer 7 — animation helpers (bounded, single rAF loop, no endless work).
       ===================================================================== */
    const tweens = new Map();
    let tweenRafId = null;

    function prefersReducedMotion() {
      return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function runTweenFrame() {
      tweenRafId = null;
      const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      tweens.forEach(function (tween, node) {
        const progress = Math.min(1, (now - tween.start) / tween.duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = tween.from + (tween.to - tween.from) * eased;
        node.textContent = value.toFixed(tween.decimals);
        if (progress >= 1) {
          node.textContent = tween.to.toFixed(tween.decimals);
          tweens.delete(node);
        }
      });
      if (tweens.size > 0) { tweenRafId = requestAnimationFrame(runTweenFrame); }
    }

    function tweenNumber(node, from, to, decimals) {
      tweens.set(node, {
        from: from,
        to: to,
        decimals: decimals,
        duration: HISTORY_CONFIG.numberTweenMs,
        start: (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()
      });
      if (tweenRafId === null) { tweenRafId = requestAnimationFrame(runTweenFrame); }
    }

    // Value text: tweened between polls, instant for missing data or reduced motion.
    function setMetricValue(node, display, numericValue, decimals) {
      if (!node) { return; }
      const isNumber = (numericValue !== null && numericValue !== undefined && isFinite(numericValue));
      const target = isNumber ? Number(numericValue).toFixed(decimals) : display;
      if (node.__target === target) { return; }

      const previous = node.__number;
      node.__target = target;
      node.__number = isNumber ? numericValue : null;

      if (isNumber && previous !== null && previous !== undefined && !prefersReducedMotion()) {
        tweenNumber(node, previous, numericValue, decimals);
        return;
      }
      tweens.delete(node);
      if (node.textContent !== target) { node.textContent = target; }
    }

    /* =====================================================================
       Layer 8 — markup builders (called ONCE per panel).
       ===================================================================== */
    function iconMarkup(iconId, className) {
      return '<svg class="icon ' + (className || '') + '" aria-hidden="true"><use href="#' + iconId + '"/></svg>';
    }

    function badgeMarkup() {
      return '<span class="badge" data-data-state="ERROR" data-role="badge">ERROR</span>';
    }

    function scaleFootMarkup(metric) {
      return '<span>' + t('age') + ': <b data-role="age">—</b></span>' +
        '<span>' + t('scale') + ': <b>' + metric.rangeMin + '…' + metric.rangeMax + ' ' + metric.unit + '</b></span>';
    }

    function numericMarkup(metric) {
      return '<article class="card glass" data-metric="' + metric.key + '" data-role="card">' +
        '<header class="card__head">' +
          '<span class="card__icon">' + iconMarkup(metric.icon) + '</span>' +
          '<div class="card__titles">' +
            '<h2 class="card__title">' + metric.label + '</h2>' +
            '<p class="card__source">' + metric.source + '</p>' +
          '</div>' + badgeMarkup() +
        '</header>' +
        '<p class="card__value">' +
          '<span class="card__number" data-role="value">—</span>' +
          '<span class="card__unit">' + metric.unit + '</span>' +
        '</p>' +
        '<p class="card__foot">' + scaleFootMarkup(metric) + '</p>' +
      '</article>';
    }

    function tickMarkup(metric) {
      return metric.ticks.map(function (tick) {
        const fraction = normalizeToRange(tick, metric.range);
        return '<span class="track__tick" style="left:' + (fraction * 100).toFixed(2) + '%"></span>';
      }).join('');
    }

    function horizontalMarkup(metric) {
      return '<div class="hrow glass" data-metric="' + metric.key + '" data-role="card">' +
        '<div class="hrow__head">' +
          '<span class="card__icon">' + iconMarkup(metric.icon) + '</span>' +
          '<span class="hrow__label">' + metric.label + '</span>' +
          '<span class="hrow__value"><b data-role="value">—</b><i>' + metric.unit + '</i></span>' +
          badgeMarkup() +
        '</div>' +
        '<div class="track" data-role="track" data-nodata="true" role="img" aria-label="' + metric.label + '">' +
          tickMarkup(metric) +
          '<div class="track__fill" data-role="fill"></div>' +
          '<div class="track__knob" data-role="knob"></div>' +
        '</div>' +
        '<div class="hrow__scale"><span>' + metric.rangeMin + ' ' + metric.unit + '</span>' +
          '<span>' + metric.source + '</span>' +
          '<span>' + metric.rangeMax + ' ' + metric.unit + '</span></div>' +
        '<p class="card__foot">' + scaleFootMarkup(metric) + '</p>' +
      '</div>';
    }

    function barsMarkup(metric) {
      const mid = Math.round((metric.range.min + metric.range.max) / 2);
      return '<div class="bcol glass" data-metric="' + metric.key + '" data-role="card">' +
        '<div class="bcol__head">' +
          '<span class="card__icon">' + iconMarkup(metric.icon) + '</span>' +
          '<h2 class="card__title">' + metric.label + '</h2>' + badgeMarkup() +
        '</div>' +
        '<div class="bcol__plot">' +
          '<div class="bcol__axis"><span>' + metric.range.max + '</span><span>' + mid + '</span>' +
            '<span>' + metric.range.min + '</span></div>' +
          '<div class="bcol__track" data-role="track" data-nodata="true" role="img" aria-label="' + metric.label + '">' +
            '<div class="bcol__bar" data-role="bar"></div>' +
          '</div>' +
        '</div>' +
        '<div class="bcol__value"><b data-role="value">—</b><i>' + metric.unit + '</i></div>' +
        '<div class="bcol__range">' + t('scale') + ' ' + metric.rangeMin + '…' + metric.rangeMax + ' ' + metric.unit + '</div>' +
        '<p class="card__foot"><span>' + t('age') + ': <b data-role="age">—</b></span></p>' +
      '</div>';
    }

    function gaugeMarkup(metric) {
      const geometry = GAUGE_GEOMETRY;
      const circumference = 2 * Math.PI * geometry.radius;
      const arc = circumference * geometry.sweepFraction;
      return '<article class="card glass gauge" data-metric="' + metric.key + '" data-role="card" data-nodata="true">' +
        '<svg class="gauge__svg" viewBox="0 0 120 120" role="img" aria-label="' + metric.label + '">' +
          '<circle class="gauge__track" cx="' + geometry.cx + '" cy="' + geometry.cy + '" r="' + geometry.radius +
            '" stroke-dasharray="' + arc.toFixed(2) + ' ' + circumference.toFixed(2) +
            '" transform="rotate(135 ' + geometry.cx + ' ' + geometry.cy + ')"/>' +
          '<circle class="gauge__progress" data-role="progress" cx="' + geometry.cx + '" cy="' + geometry.cy +
            '" r="' + geometry.radius + '" stroke-dasharray="0 ' + circumference.toFixed(2) +
            '" transform="rotate(135 ' + geometry.cx + ' ' + geometry.cy + ')"/>' +
          '<use class="gauge__icon" href="#' + metric.icon + '" x="46" y="26" width="28" height="28"/>' +
          '<text class="gauge__value" data-role="value" x="' + geometry.cx + '" y="76">—</text>' +
          '<text class="gauge__unit" x="' + geometry.cx + '" y="94">' + metric.unit + '</text>' +
        '</svg>' +
        '<div class="gauge__meta"><h2 class="card__title">' + metric.label + '</h2>' + badgeMarkup() + '</div>' +
        '<p class="gauge__scale">' + t('scale') + ' ' + metric.rangeMin + '…' + metric.rangeMax + ' ' + metric.unit +
          ' · ' + t('age') + ': <b data-role="age">—</b></p>' +
      '</article>';
    }

    function historyMarkup() {
      const chips = HISTORY_CONFIG.presets.map(function (preset) {
        return '<button type="button" class="chip" data-preset="' + preset.id + '" aria-pressed="false">' +
          preset.label + '</button>';
      }).join('');

      const rows = METRIC_KEYS.map(function (key) {
        const config = METRIC_CONFIG[key];
        return '<div class="tt__row" data-metric="' + key + '">' +
          iconMarkup(config.icon) +
          '<span class="tt__value" data-role="tt-value-' + key + '">—</span>' +
          '<span class="tt__unit">' + config.unit + '</span>' +
          '<span class="tt__state" data-data-state="ERROR" data-role="tt-state-' + key + '">—</span>' +
        '</div>';
      }).join('');

      return '<div class="history glass" data-role="history">' +
        '<header class="history__head">' +
          '<div class="history__title">' +
            '<h2>' + t('history') + '</h2>' +
            '<p class="history__sub" data-role="summary">' + t('collecting_history') + '</p>' +
          '</div>' +
          '<div class="history__actions">' +
            '<label class="visually-hidden" for="history-retention" data-i18n="retention_label"></label>' +
            '<select class="history__select" id="history-retention" data-role="retention-select"></select>' +
            '<button type="button" class="btn" data-role="clear">' + t('clear_history') + '</button>' +
          '</div>' +
        '</header>' +
        '<div class="chips" role="group" aria-label="' + t('chips_aria') + '" data-role="chips">' + chips + '</div>' +
        '<p class="history__hint" data-role="hint"></p>' +
        '<div class="chart" data-role="chart" tabindex="0" role="group"' +
          ' aria-label="' + t('chart_aria') + '">' +
          '<svg class="chart__svg" data-role="chart-svg" role="img" aria-label="' + t('chart_aria_summary') + '"></svg>' +
          '<div class="chart__tooltip" data-role="tooltip" hidden>' +
            '<div class="tt__time" data-role="tt-time">—</div>' + rows +
          '</div>' +
        '</div>' +
        '<p class="chart__empty" data-role="empty" hidden>' +
          '<b>' + t('empty_title') + '</b>' +
          '<span>' + t('empty_hint') + '</span>' +
        '</p>' +
        '<div class="history__table visually-hidden" data-role="table-wrap">' +
          '<h3>' + t('last_points') + '</h3>' +
          '<table><caption>' + t('table_caption') + '</caption>' +
            '<thead><tr><th scope="col">' + t('table_time') + '</th><th scope="col">' + t('table_temperature') + '</th>' +
            '<th scope="col">' + t('table_humidity') + '</th><th scope="col">' + t('table_pressure') + '</th><th scope="col">' + t('table_state') + '</th></tr></thead>' +
            '<tbody data-role="table-body"></tbody></table>' +
        '</div>' +
      '</div>';
    }

    function collectRefs(root) {
      const metrics = {};
      METRIC_KEYS.forEach(function (key) {
        const scope = root.querySelector('[data-metric="' + key + '"]');
        if (!scope) { return; }
        metrics[key] = {
          scope: scope,
          badge: scope.querySelector('[data-role="badge"]'),
          value: scope.querySelector('[data-role="value"]'),
          age: scope.querySelector('[data-role="age"]'),
          track: scope.querySelector('[data-role="track"]'),
          fill: scope.querySelector('[data-role="fill"]'),
          knob: scope.querySelector('[data-role="knob"]'),
          bar: scope.querySelector('[data-role="bar"]'),
          progress: scope.querySelector('[data-role="progress"]')
        };
      });
      return { metrics: metrics };
    }

    function buildPanels() {
      METRIC_KEYS.forEach(function (key) {
        const config = METRIC_CONFIG[key];
        config.rangeMin = config.range.min;
        config.rangeMax = config.range.max;
      });

      const roots = {
        numeric: document.getElementById('panel-numeric'),
        horizontal: document.getElementById('panel-horizontal'),
        bars: document.getElementById('panel-bars'),
        gauges: document.getElementById('panel-gauges'),
        history: document.getElementById('panel-history')
      };
      const builders = {
        numeric: numericMarkup,
        horizontal: horizontalMarkup,
        bars: barsMarkup,
        gauges: gaugeMarkup
      };
      const wrappers = {
        numeric: '<div class="grid">',
        horizontal: '<div class="hrows">',
        bars: '<div class="barchart">',
        gauges: '<div class="gauges">'
      };

      MODES.forEach(function (mode) {
        const root = roots[mode];
        dom.panelRoots[mode] = root || null;
        if (!root) { dom.refs[mode] = { metrics: {} }; return; }
        if (mode === 'history') {
          root.innerHTML = historyMarkup();
          dom.refs.history = buildHistoryRefs(root);
          return;
        }
        root.innerHTML = wrappers[mode] + METRIC_KEYS.map(function (key) {
          return builders[mode](METRIC_CONFIG[key]);
        }).join('') + '</div>';
        dom.refs[mode] = collectRefs(root);
      });
    }

    /* =====================================================================
       Layer 9 — rendering. Renderers consume uiModel only.
       ===================================================================== */
    function setText(node, text) {
      if (node && node.textContent !== text) { node.textContent = text; }
    }

    function applyMetricChrome(nodes, metric) {
      if (!nodes || !nodes.scope) { return; }
      const scope = nodes.scope;
      if (metric.colorRole) {
        if (scope.dataset.tone !== metric.colorRole) { scope.dataset.tone = metric.colorRole; }
      } else if (scope.dataset.tone) {
        delete scope.dataset.tone;
      }
      if (scope.dataset.dataState !== metric.dataState) { scope.dataset.dataState = metric.dataState; }

      if (nodes.badge) {
        setText(nodes.badge, metric.dataState);
        if (nodes.badge.dataset.dataState !== metric.dataState) {
          nodes.badge.dataset.dataState = metric.dataState;
        }
      }
      setMetricValue(nodes.value, metric.display, metric.value, metric.decimals);
      setText(nodes.age, metric.ageText);
      scope.setAttribute('aria-label',
        metric.label + ': ' + metric.display + ' ' + metric.unit + ', ' + metric.dataState);
    }

    function renderNumeric(model) {
      model.metrics.forEach(function (metric) {
        applyMetricChrome(dom.refs.numeric.metrics[metric.key], metric);
      });
    }

    function renderHorizontal(model) {
      model.metrics.forEach(function (metric) {
        const nodes = dom.refs.horizontal.metrics[metric.key];
        applyMetricChrome(nodes, metric);
        if (!nodes || !nodes.track) { return; }
        const noData = !metric.hasData;
        if (nodes.track.dataset.nodata !== String(noData)) {
          nodes.track.dataset.nodata = String(noData);
        }
        const percent = noData ? 0 : metric.fraction * 100;
        if (nodes.fill) { nodes.fill.style.width = percent.toFixed(2) + '%'; }
        if (nodes.knob) { nodes.knob.style.left = percent.toFixed(2) + '%'; }
      });
    }

    function renderBars(model) {
      model.metrics.forEach(function (metric) {
        const nodes = dom.refs.bars.metrics[metric.key];
        applyMetricChrome(nodes, metric);
        if (!nodes || !nodes.track) { return; }
        const noData = !metric.hasData;
        if (nodes.track.dataset.nodata !== String(noData)) {
          nodes.track.dataset.nodata = String(noData);
        }
        if (nodes.bar) {
          nodes.bar.style.height = (noData ? 0 : metric.fraction * 100).toFixed(2) + '%';
        }
      });
    }

    function renderGauges(model) {
      const circumference = 2 * Math.PI * GAUGE_GEOMETRY.radius;
      const arc = circumference * GAUGE_GEOMETRY.sweepFraction;
      model.metrics.forEach(function (metric) {
        const nodes = dom.refs.gauges.metrics[metric.key];
        applyMetricChrome(nodes, metric);
        if (!nodes || !nodes.scope) { return; }
        const noData = !metric.hasData;
        if (nodes.scope.dataset.nodata !== String(noData)) {
          nodes.scope.dataset.nodata = String(noData);
        }
        if (nodes.progress) {
          const filled = noData ? 0 : metric.fraction * arc;
          nodes.progress.setAttribute('stroke-dasharray',
            filled.toFixed(2) + ' ' + circumference.toFixed(2));
        }
      });
    }

    function renderDataState(model) {
      if (dom.connection && dom.connection.dataset.dataState !== model.worstState) {
        dom.connection.dataset.dataState = model.worstState;
      }
      return model.worstState;
    }

    function renderConnectionState() {
      const online = uiState.connection === CONNECTION_STATES.ONLINE;
      if (dom.connection) { dom.connection.dataset.state = uiState.connection; }
      setText(dom.connectionLabel, uiState.connection);

      let meta;
      if (uiState.lastSuccessAt === null) {
        meta = uiState.lastErrorMessage
          ? t('no_response') + ' (' + uiState.lastErrorMessage + ')'
          : t('wait_update');
      } else if (online) {
        meta = t('last_update') + ': ' + formatClock(uiState.lastSuccessAt, true) +
          ' (' + formatAge(Date.now() - uiState.lastSuccessAt) + ' ' + t('ago') + ')';
      } else {
        meta = t('error_prefix') + ': ' + formatClock(uiState.lastSuccessAt, true) +
          ' · ' + t('error_suffix') + ': ' + (uiState.lastErrorMessage || t('network_down'));
      }
      setText(dom.connectionMeta, meta);

      if (dom.uptime) {
        setText(dom.uptime, uiState.weather ? formatDuration(uiState.weather.uptimeMs) : '—');
      }
      if (dom.pollInterval) {
        const hidden = typeof document !== 'undefined' && document.visibilityState === 'hidden';
        setText(dom.pollInterval,
          (hidden ? APP_CONFIG.pollIntervalHiddenMs : APP_CONFIG.pollIntervalMs) + ' ' + t('milliseconds'));
      }
    }

    function renderCurrentMode() {
      const model = buildUiModel();
      uiState.uiModel = model;

      if (uiState.activeMode === 'horizontal') { renderHorizontal(model); }
      else if (uiState.activeMode === 'bars') { renderBars(model); }
      else if (uiState.activeMode === 'gauges') { renderGauges(model); }
      else if (uiState.activeMode === 'history') { renderHistory(model); }
      else { renderNumeric(model); }

      renderDataState(model);
      renderConnectionState();
      return model;
    }

    /* =====================================================================
       Layer 10 — history presentation: chart, tooltip, table, controls.
       ===================================================================== */
    const NS = 'http://www.w3.org/2000/svg';

    function svgEl(name, attrs) {
      const node = document.createElementNS(NS, name);
      if (attrs) {
        Object.keys(attrs).forEach(function (key) { node.setAttribute(key, attrs[key]); });
      }
      return node;
    }

    function buildHistoryRefs(root) {
      const refs = {
        root: root,
        summary: root.querySelector('[data-role="summary"]'),
        hint: root.querySelector('[data-role="hint"]'),
        select: root.querySelector('[data-role="retention-select"]'),
        chips: Array.prototype.slice.call(root.querySelectorAll('[data-preset]')),
        clear: root.querySelector('[data-role="clear"]'),
        chart: root.querySelector('[data-role="chart"]'),
        svg: root.querySelector('[data-role="chart-svg"]'),
        tooltip: root.querySelector('[data-role="tooltip"]'),
        ttTime: root.querySelector('[data-role="tt-time"]'),
        empty: root.querySelector('[data-role="empty"]'),
        tableBody: root.querySelector('[data-role="table-body"]'),
        tt: {},
        lanes: {},
        axes: { xLabels: [], xGrid: [], cursorX: null },
        cursor: null,
        signature: '',
        tableSignature: ''
      };

      METRIC_KEYS.forEach(function (key) {
        refs.tt[key] = {
          value: root.querySelector('[data-role="tt-value-' + key + '"]'),
          state: root.querySelector('[data-role="tt-state-' + key + '"]')
        };
      });

      // Retention controls: native select (screen readers, mobile pickers) plus
      // preset chips for one-tap switching. Listeners are attached once.
      HISTORY_CONFIG.presets.forEach(function (preset) {
        const option = document.createElement('option');
        option.value = preset.id;
        option.textContent = preset.label + ' — ' + formatDurationShort(preset.retentionMs);
        refs.select.appendChild(option);
      });
      refs.select.addEventListener('change', function () {
        setHistoryRetention(refs.select.value);
      });
      refs.chips.forEach(function (chip) {
        chip.addEventListener('click', function () { setHistoryRetention(chip.dataset.preset); });
      });
      refs.clear.addEventListener('click', onClearHistoryClick);

      // Chart interaction: one set of listeners, attached once.
      refs.chart.addEventListener('pointermove', onChartPointerMove);
      refs.chart.addEventListener('pointerdown', onChartPointerMove);
      refs.chart.addEventListener('pointerleave', onChartPointerLeave);
      refs.chart.addEventListener('pointercancel', onChartPointerLeave);
      refs.chart.addEventListener('keydown', onChartKeydown);
      refs.chart.addEventListener('blur', onChartPointerLeave);

      buildChartSkeleton(refs);
      return refs;
    }

    // The SVG skeleton is created once; only attributes change afterwards.
    function buildChartSkeleton(refs) {
      const svg = refs.svg;
      while (svg.firstChild) { svg.removeChild(svg.firstChild); }

      const defs = svgEl('defs');
      METRIC_KEYS.forEach(function (key) {
        const gradient = svgEl('linearGradient', {
          id: 'hist-grad-' + key, gradientUnits: 'userSpaceOnUse', x1: '0', y1: '0', x2: '0', y2: '100'
        });
        gradient.appendChild(svgEl('stop', { offset: '0%', 'stop-color': 'var(--metric-' + key + ')', 'stop-opacity': '0.55' }));
        gradient.appendChild(svgEl('stop', { offset: '100%', 'stop-color': 'var(--metric-' + key + ')', 'stop-opacity': '0' }));
        defs.appendChild(gradient);
      });
      svg.appendChild(defs);

      const area = svgEl('g', { 'data-role': 'plot' });
      svg.appendChild(area);
      refs.plot = area;

      METRIC_KEYS.forEach(function (key) {
        const lane = {
          frame: svgEl('rect', { class: 'chart__lane-frame', rx: '8' }),
          grid: svgEl('g', { class: 'chart__grid' }),
          fill: svgEl('path', { 'data-metric': key, fill: 'url(#hist-grad-' + key + ')', stroke: 'none', opacity: '0.5' }),
          line: svgEl('path', { class: 'chart__line', 'data-metric': key, 'data-state': 'FRESH', d: '' }),
          dots: svgEl('g', {}),
          current: svgEl('circle', { class: 'chart__current', r: '3.5', 'data-metric': key, cx: '-10', cy: '-10' }),
          label: svgEl('text', { class: 'chart__lane-label' }),
          yLabels: [
            svgEl('text', { class: 'chart__ylist', 'text-anchor': 'end' }),
            svgEl('text', { class: 'chart__ylist', 'text-anchor': 'end' }),
            svgEl('text', { class: 'chart__ylist', 'text-anchor': 'end' })
          ],
          yGrid: [svgEl('line', { class: 'chart__grid' }), svgEl('line', { class: 'chart__grid' }), svgEl('line', { class: 'chart__grid' })]
        };
        lane.dotPool = [];
        for (let i = 0; i < HISTORY_CHART.poolDots; i += 1) {
          const dot = svgEl('circle', { class: 'chart__dot', r: '2.6', cx: '-10', cy: '-10', 'data-state': 'STALE' });
          dot.style.display = 'none';
          lane.dotPool.push(dot);
          lane.dots.appendChild(dot);
        }
        lane.yGrid.forEach(function (node) { area.appendChild(node); });
        area.appendChild(lane.fill);
        area.appendChild(lane.line);
        area.appendChild(lane.dots);
        area.appendChild(lane.current);
        area.appendChild(lane.frame);
        lane.yLabels.forEach(function (node) { area.appendChild(node); });
        area.appendChild(lane.label);
        refs.lanes[key] = lane;
      });

      for (let i = 0; i < HISTORY_CONFIG.axisTicks; i += 1) {
        refs.axes.xGrid.push(svgEl('line', { class: 'chart__grid chart__grid--v' }));
        refs.axes.xLabels.push(svgEl('text', { class: 'chart__xlist', 'text-anchor': 'middle' }));
      }
      refs.axes.xGrid.forEach(function (node) { area.appendChild(node); });
      refs.axes.xLabels.forEach(function (node) { area.appendChild(node); });

      refs.cursor = svgEl('g', { 'data-role': 'cursor' });
      refs.axes.cursorX = svgEl('line', { class: 'chart__cursor' });
      refs.cursor.appendChild(refs.axes.cursorX);
      refs.cursorDots = {};
      METRIC_KEYS.forEach(function (key) {
        const dot = svgEl('circle', { class: 'chart__cursor-dot', r: '3', cx: '-10', cy: '-10', 'data-metric': key });
        refs.cursorDots[key] = dot;
        refs.cursor.appendChild(dot);
      });
      refs.cursor.style.display = 'none';
      area.appendChild(refs.cursor);
    }

    function chartGeometry(width) {
      const laneHeight = width < 420 ? HISTORY_CHART.laneHeights.small
        : (width < 760 ? HISTORY_CHART.laneHeights.medium : HISTORY_CHART.laneHeights.large);
      const padLeft = width < 420 ? 33 : 44;
      const padRight = 10;
      const lanePadTop = 22;
      const lanePadBottom = 10;
      const axisLabelSpace = 16;
      const height = laneHeight * METRIC_KEYS.length + axisLabelSpace;
      return {
        width: width,
        height: height,
        padLeft: padLeft,
        padRight: padRight,
        laneHeight: laneHeight,
        lanePadTop: lanePadTop,
        lanePadBottom: lanePadBottom,
        plotWidth: Math.max(10, width - padLeft - padRight),
        axisLabelSpace: axisLabelSpace
      };
    }

    function historySeriesFor(metricKey, series) {
      return series.metrics[metricKey] || null;
    }

    function renderHistoryChart(series, geometry) {
      const refs = dom.refs.history;
      if (!refs) { return; }
      refs.svg.setAttribute('viewBox', '0 0 ' + geometry.width + ' ' + geometry.height);
      refs.svg.setAttribute('width', String(geometry.width));
      refs.svg.setAttribute('height', String(geometry.height));

      const span = Math.max(1, series.tMax - series.tMin);
      const xFor = function (time) {
        return geometry.padLeft + ((time - series.tMin) / span) * geometry.plotWidth;
      };

      METRIC_KEYS.forEach(function (key, laneIndex) {
        const lane = refs.lanes[key];
        const metric = series.metrics[key];
        const laneTop = laneIndex * geometry.laneHeight;
        const plotTop = laneTop + geometry.lanePadTop;
        const plotHeight = geometry.laneHeight - geometry.lanePadTop - geometry.lanePadBottom;
        const ySpan = Math.max(0.0001, metric.yMax - metric.yMin);
        const yFor = function (value) {
          return plotTop + plotHeight - ((value - metric.yMin) / ySpan) * plotHeight;
        };

        lane.frame.setAttribute('x', '0.5');
        lane.frame.setAttribute('y', String(laneTop + 0.5));
        lane.frame.setAttribute('width', String(geometry.width - 1));
        lane.frame.setAttribute('height', String(geometry.laneHeight - 1));

        const config = METRIC_CONFIG[key];
        lane.label.setAttribute('x', '6');
        lane.label.setAttribute('y', String(laneTop + 12));
        lane.label.textContent = config.label + ', ' + config.unit;

        metric.yTicks.forEach(function (tick, tickIndex) {
          const y = yFor(tick);
          const grid = lane.yGrid[tickIndex];
          grid.setAttribute('x1', String(geometry.padLeft));
          grid.setAttribute('x2', String(geometry.width - geometry.padRight));
          grid.setAttribute('y1', y.toFixed(1));
          grid.setAttribute('y2', y.toFixed(1));
          const label = lane.yLabels[tickIndex];
          label.setAttribute('x', String(geometry.padLeft - 5));
          label.setAttribute('y', (y + 3).toFixed(1));
          label.textContent = String(tick);
        });

        // Line segments: null values and long gaps break the path (no fake data).
        const segments = [];
        let activeSegment = null;
        metric.drawn.forEach(function (point) {
          const x = xFor(point.time).toFixed(1);
          const y = yFor(point.value).toFixed(1);
          if (activeSegment === null || point.segment !== activeSegment.id) {
            activeSegment = { id: point.segment, points: [] };
            segments.push(activeSegment);
          }
          activeSegment.points.push(x + ',' + y);
        });

        let d = '';
        let fillD = '';
        segments.forEach(function (segment) {
          if (segment.points.length === 0) { return; }
          d += 'M' + segment.points.join('L');
          if (segment.points.length > 1) {
            const firstX = segment.points[0].split(',')[0];
            const lastX = segment.points[segment.points.length - 1].split(',')[0];
            fillD += 'M' + firstX + ',' + (plotTop + plotHeight).toFixed(1) + 'L' +
              segment.points.join('L') + 'L' + lastX + ',' + (plotTop + plotHeight).toFixed(1) + 'Z';
          }
        });
        lane.line.setAttribute('d', d);
        lane.fill.setAttribute('d', fillD);

        const latest = metric.points.filter(function (point) { return point.value !== null; }).pop();
        const latestState = latest ? latest.state : DATA_STATES.ERROR;
        if (lane.line.dataset.state !== latestState) { lane.line.dataset.state = latestState; }
        if (latest) {
          lane.current.setAttribute('cx', xFor(latest.time).toFixed(1));
          lane.current.setAttribute('cy', yFor(latest.value).toFixed(1));
          lane.current.setAttribute('fill', 'var(--metric-' + key + ')');
        } else {
          lane.current.setAttribute('cx', '-10');
        }

        // Non-FRESH samples get their own small marker so the metric colour stays intact.
        let poolIndex = 0;
        metric.drawn.forEach(function (point) {
          if (poolIndex >= lane.dotPool.length) { return; }
          if (point.state === DATA_STATES.FRESH) { return; }
          const dot = lane.dotPool[poolIndex];
          dot.setAttribute('cx', xFor(point.time).toFixed(1));
          dot.setAttribute('cy', yFor(point.value).toFixed(1));
          dot.setAttribute('data-state', point.state);
          dot.style.display = '';
          poolIndex += 1;
        });
        for (let i = poolIndex; i < lane.dotPool.length; i += 1) {
          lane.dotPool[i].style.display = 'none';
        }

        lane.__yFor = yFor;
        lane.__xFor = xFor;
        lane.__index = laneIndex;
      });

      refs.axes.xLabels.forEach(function (label, index) {
        const time = series.xTicks[index];
        const x = xFor(time);
        label.setAttribute('x', x.toFixed(1));
        label.setAttribute('y', String(geometry.height - 4));
        label.textContent = formatClock(time, series.withSeconds);
        const grid = refs.axes.xGrid[index];
        grid.setAttribute('x1', x.toFixed(1));
        grid.setAttribute('x2', x.toFixed(1));
        grid.setAttribute('y1', '0');
        grid.setAttribute('y2', String(geometry.height - geometry.axisLabelSpace));
      });

      refs.geometry = geometry;
      refs.series = series;
      refs.svg.setAttribute('aria-label', historyAriaLabel(series));
    }

    function historyAriaLabel(series) {
      if (series.count === 0) {
        return t('chart_aria_empty');
      }
      const parts = METRIC_KEYS.map(function (key) {
        const metric = series.metrics[key];
        if (metric.min === null) { return METRIC_CONFIG[key].label + ': ' + t('no_data'); }
        const decimals = METRIC_CONFIG[key].decimals;
        return METRIC_CONFIG[key].label + ' ' + t('from_to') + ' ' + metric.min.toFixed(decimals) + ' — ' +
          metric.max.toFixed(decimals) + ' ' + METRIC_CONFIG[key].unit;
      });
      return t('chart_aria_summary') + ': ' + series.count + ' ' + t('points') + ' ' + t('collection_period') + ' ' +
        formatDurationShort(series.tMax - series.tMin) + '. ' + parts.join('. ') + '.';
    }

    function renderHistoryTooltip() {
      const refs = dom.refs.history;
      const series = refs && refs.series;
      if (!refs || !series) { return; }

      const index = uiState.hoverIndex;
      if (index < 0 || index >= history.count) {
        refs.tooltip.hidden = true;
        if (refs.cursor) { refs.cursor.style.display = 'none'; }
        return;
      }

      const sample = historySampleAt(index);
      if (!sample) {
        refs.tooltip.hidden = true;
        if (refs.cursor) { refs.cursor.style.display = 'none'; }
        return;
      }

      const geometry = refs.geometry;
      const span = Math.max(1, series.tMax - series.tMin);
      const x = geometry.padLeft + ((sample.time - series.tMin) / span) * geometry.plotWidth;

      refs.tooltip.hidden = false;
      refs.ttTime.textContent = formatClock(sample.time, true);
      METRIC_KEYS.forEach(function (key) {
        const value = historyMetricValue(sample, key);
        const state = historyMetricState(sample, key);
        const target = refs.tt[key];
        const decimals = METRIC_CONFIG[key].decimals;
        setText(target.value, value === null ? '—' : value.toFixed(decimals));
        setText(target.state, state);
        if (target.state.dataset.dataState !== state) { target.state.dataset.dataState = state; }
      });

      const tooltipWidth = refs.tooltip.offsetWidth || 160;
      const maxLeft = Math.max(4, geometry.width - tooltipWidth - 4);
      refs.tooltip.style.left = Math.max(4, Math.min(maxLeft, x - tooltipWidth / 2)) + 'px';
      refs.tooltip.style.top = '8px';

      refs.cursor.style.display = '';
      refs.axes.cursorX.setAttribute('x1', x.toFixed(1));
      refs.axes.cursorX.setAttribute('x2', x.toFixed(1));
      refs.axes.cursorX.setAttribute('y1', '0');
      refs.axes.cursorX.setAttribute('y2', String(geometry.height - geometry.axisLabelSpace));
      METRIC_KEYS.forEach(function (key) {
        const lane = refs.lanes[key];
        const value = historyMetricValue(sample, key);
        const dot = refs.cursorDots[key];
        if (value === null) { dot.setAttribute('cx', '-10'); return; }
        dot.setAttribute('cx', x.toFixed(1));
        dot.setAttribute('cy', lane.__yFor(value).toFixed(1));
        dot.setAttribute('fill', 'var(--metric-' + key + ')');
      });
    }

    function renderHistoryTable(series) {
      const refs = dom.refs.history;
      if (!refs || !refs.tableBody) { return; }
      const rows = Math.min(8, history.count);
      const signature = history.totalSamples + '|' + history.count + '|' + uiState.historyPresetId + '|' + rows;
      if (refs.tableSignature === signature) { return; }
      refs.tableSignature = signature;

      const html = [];
      for (let i = history.count - rows; i < history.count; i += 1) {
        const sample = historySampleAt(i);
        if (!sample) { continue; }
        const cells = METRIC_KEYS.map(function (key) {
          const value = historyMetricValue(sample, key);
          return '<td>' + (value === null ? '—' : value.toFixed(METRIC_CONFIG[key].decimals)) + '</td>';
        }).join('');
        const state = historyMetricState(sample, 'temperature');
        html.push('<tr><td>' + formatClock(sample.time, true) + '</td>' + cells + '<td>' + state + '</td></tr>');
      }
      refs.tableBody.innerHTML = html.join('');
    }

    function renderHistory(model) {
      const refs = dom.refs.history;
      if (!refs) { return; }
      const preset = activeHistoryPreset();
      const now = Date.now();
      const series = buildHistorySeries(now);

      // Controls reflect application state.
      if (refs.select.value !== preset.id) { refs.select.value = preset.id; }
      refs.chips.forEach(function (chip) {
        const pressed = chip.dataset.preset === preset.id ? 'true' : 'false';
        if (chip.getAttribute('aria-pressed') !== pressed) { chip.setAttribute('aria-pressed', pressed); }
      });

      const stepText = preset.sampleMs >= 60000
        ? (preset.sampleMs / 60000) + ' ' + t('minutes')
        : (preset.sampleMs / 1000) + ' ' + t('seconds');
      setText(refs.summary, t('retention') + ': ' + preset.label + ' · ' + t('step') + ' ' + stepText + ' · ' + t('points') + ' ' +
        history.count + '/' + history.capacity + ' · ' + t('collected') + ' ' + history.totalSamples);
      setText(refs.hint, t('history_hint'));

      const isEmpty = history.count === 0;
      refs.empty.hidden = !isEmpty;
      refs.chart.hidden = isEmpty;

      if (isEmpty) {
        uiState.hoverIndex = -1;
        refs.tooltip.hidden = true;
        setText(refs.summary, t('collecting_history') + ' ' + t('retention') + ': ' + preset.label + ' · ' + t('step') + ' ' + stepText);
        renderHistoryTable(series);
        return;
      }

      const width = Math.max(180, Math.round(refs.chart.clientWidth || refs.root.clientWidth || 320) - 12);
      const geometry = chartGeometry(width);
      renderHistoryChart(series, geometry);
      if (uiState.hoverIndex >= history.count) { uiState.hoverIndex = history.count - 1; }
      renderHistoryTooltip();
      renderHistoryTable(series);
    }

    /* =====================================================================
       Layer 11 — history interactions.
       ===================================================================== */
    function setHistoryRetention(presetId) {
      const preset = historyConfigure(presetId, Date.now());
      uiState.hoverIndex = -1;
      dom.refs.history.tableSignature = '';
      if (uiState.activeMode === 'history') { renderHistory(uiState.uiModel); }
      return preset;
    }

    function onClearHistoryClick() {
      const button = dom.refs.history.clear;
      if (!uiState.clearArmed) {
        uiState.clearArmed = true;
        button.dataset.armed = 'true';
        button.textContent = t('clear_history_confirm');
        if (uiState.clearTimer) { clearTimeout(uiState.clearTimer); }
        uiState.clearTimer = setTimeout(function () {
          uiState.clearArmed = false;
          uiState.clearTimer = null;
          button.dataset.armed = 'false';
          button.textContent = t('clear_history');
        }, 4000);
        return;
      }
      if (uiState.clearTimer) { clearTimeout(uiState.clearTimer); uiState.clearTimer = null; }
      uiState.clearArmed = false;
      button.dataset.armed = 'false';
      button.textContent = t('clear_history');
      resetHistory();
      dom.refs.history.tableSignature = '';
      renderHistory(uiState.uiModel);
    }

    function historyIndexFromClientX(clientX) {
      const refs = dom.refs.history;
      if (!refs || !refs.geometry || history.count === 0) { return -1; }
      const rect = refs.svg.getBoundingClientRect();
      if (rect.width <= 0) { return -1; }
      const scale = refs.geometry.width / rect.width;
      const localX = (clientX - rect.left) * scale;
      const ratio = (localX - refs.geometry.padLeft) / refs.geometry.plotWidth;
      const targetTime = refs.series.tMin + Math.max(0, Math.min(1, ratio)) * (refs.series.tMax - refs.series.tMin);

      let best = -1;
      let bestDistance = Infinity;
      for (let i = 0; i < history.count; i += 1) {
        const sample = historySampleAt(i);
        const distance = Math.abs(sample.time - targetTime);
        if (distance < bestDistance) { bestDistance = distance; best = i; }
      }
      return best;
    }

    function onChartPointerMove(event) {
      const index = historyIndexFromClientX(event.clientX);
      if (index < 0 || index === uiState.hoverIndex) {
        if (index < 0) { renderHistoryTooltip(); }
        return;
      }
      uiState.hoverIndex = index;
      renderHistoryTooltip();
    }

    function onChartPointerLeave() {
      if (uiState.hoverIndex === -1) { return; }
      uiState.hoverIndex = -1;
      renderHistoryTooltip();
    }

    function onChartKeydown(event) {
      if (history.count === 0) { return; }
      let index = uiState.hoverIndex;
      if (event.key === 'ArrowLeft') { index = index < 0 ? history.count - 1 : Math.max(0, index - 1); }
      else if (event.key === 'ArrowRight') { index = index < 0 ? 0 : Math.min(history.count - 1, index + 1); }
      else if (event.key === 'Home') { index = 0; }
      else if (event.key === 'End') { index = history.count - 1; }
      else if (event.key === 'Escape') { uiState.hoverIndex = -1; renderHistoryTooltip(); return; }
      else { return; }
      event.preventDefault();
      uiState.hoverIndex = index;
      renderHistoryTooltip();
    }

    /* =====================================================================
       Layer 12 — tabs: presentation state only.
       ===================================================================== */
    function moveTabIndicator() {
      const indicator = document.getElementById('tabs-indicator');
      const container = document.getElementById('tabs');
      if (!indicator || !container) { return; }
      const active = dom.tabs.filter(function (tab) { return tab.dataset.mode === uiState.activeMode; })[0];
      if (!active) { return; }
      const base = container.getBoundingClientRect();
      const rect = active.getBoundingClientRect();
      indicator.style.opacity = '1';
      indicator.style.width = rect.width + 'px';
      indicator.style.height = rect.height + 'px';
      indicator.style.transform = 'translate(' + (rect.left - base.left) + 'px,' + (rect.top - base.top) + 'px)';
    }

    function setActiveMode(mode) {
      const next = MODES.indexOf(mode) >= 0 ? mode : DEFAULT_MODE;
      uiState.activeMode = next;

      dom.tabs.forEach(function (tab) {
        const selected = tab.dataset.mode === next;
        tab.setAttribute('aria-selected', selected ? 'true' : 'false');
        tab.tabIndex = selected ? 0 : -1;
      });
      MODES.forEach(function (candidate) {
        const panel = dom.panelsByMode[candidate];
        if (panel) { panel.hidden = (candidate !== next); }
      });

      renderCurrentMode();   // same uiModel, no fetch, no extra polling
      moveTabIndicator();
      return next;
    }

    function onTabKeydown(event) {
      if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(event.key) < 0) { return; }
      event.preventDefault();
      const current = MODES.indexOf(uiState.activeMode);
      let next = current;
      if (event.key === 'ArrowLeft') { next = (current - 1 + MODES.length) % MODES.length; }
      if (event.key === 'ArrowRight') { next = (current + 1) % MODES.length; }
      if (event.key === 'Home') { next = 0; }
      if (event.key === 'End') { next = MODES.length - 1; }
      setActiveMode(MODES[next]);
      if (dom.tabs[next]) { dom.tabs[next].focus(); }
    }

    function initTabs() {
      dom.tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
      MODES.forEach(function (mode) {
        dom.panelsByMode[mode] = document.getElementById('panel-' + mode);
      });
      dom.tabs.forEach(function (tab) {
        tab.addEventListener('click', function () { setActiveMode(tab.dataset.mode); });
        tab.addEventListener('keydown', onTabKeydown);
      });
    }

    /* =====================================================================
       Layer 13 — polling. Recursive setTimeout + in-flight guard.
       ===================================================================== */
    function scheduleNextPoll() {
      if (uiState.timerId !== null) { clearTimeout(uiState.timerId); }
      const hidden = typeof document !== 'undefined' && document.visibilityState === 'hidden';
      const delay = hidden ? APP_CONFIG.pollIntervalHiddenMs : APP_CONFIG.pollIntervalMs;
      uiState.timerId = setTimeout(pollOnce, delay);
    }

    async function pollOnce() {
      if (uiState.inFlight) {
        scheduleNextPoll();
        return;
      }
      uiState.inFlight = true;
      uiState.pollCount += 1;

      try {
        const raw = await fetchWeather();
        const normalized = normalizeWeather(raw);

        uiState.weather = normalized;
        uiState.connection = CONNECTION_STATES.ONLINE;
        uiState.lastSuccessAt = Date.now();
        uiState.lastErrorMessage = '';

        updateHistory(normalized, uiState.lastSuccessAt);   // same cycle, no second timer
        renderCurrentMode();
      } catch (error) {
        uiState.connection = CONNECTION_STATES.OFFLINE;
        uiState.lastErrorAt = Date.now();
        uiState.lastErrorMessage = (error && error.message) ? error.message : String(error);
        uiState.errorCount += 1;

        // History stays intact while offline; only live states degrade.
        renderCurrentMode();
      } finally {
        uiState.inFlight = false;
        renderConnectionState();
        scheduleNextPoll();
      }
    }

    function handleVisibilityChange() {
      renderConnectionState();
      if (typeof document !== 'undefined' && document.visibilityState === 'visible') {
        scheduleNextPoll();
      }
    }

    function startUiTicker() {
      if (uiState.tickerId !== null) { return; }
      uiState.tickerId = setInterval(function () {
        renderCurrentMode();
      }, APP_CONFIG.uiTickMs);
    }

    function handleResize() {
      if (uiState.activeMode === 'history') { renderHistory(uiState.uiModel); }
      moveTabIndicator();
    }

    function cacheDom() {
      dom.connection = document.getElementById('connection');
      dom.connectionLabel = document.getElementById('connection-label');
      dom.connectionMeta = document.getElementById('connection-meta');
      dom.uptime = document.getElementById('uptime');
      dom.pollInterval = document.getElementById('poll-interval');
    }

    /* =====================================================================
       Layer 14 — localization application.

       applyLocale() paints every localized string from the catalog: static
       markup through [data-i18n]/[data-i18n-aria], generated markup because the
       panels are rebuilt from the configured labels. Numbers and units are not
       touched: only the catalog carries words.
       ===================================================================== */
    function retentionText(ms) {
      if (ms < 60 * 1000) { return (ms / 1000) + ' ' + t('seconds'); }
      if (ms < 3600 * 1000) { return (ms / 60000) + ' ' + t('minutes'); }
      return (ms / 3600000) + ' ' + t('hours');
    }

    function applyLocale() {
      if (typeof document === 'undefined') { return; }
      /* CSS-generated text (the "[data-nodata]" placeholder) follows the locale. */
      document.documentElement.style.setProperty('--nodata-text', '"' + t('no_data') + '"');

      Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (node) {
        node.textContent = t(node.getAttribute('data-i18n'));
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (node) {
        node.setAttribute('aria-label', t(node.getAttribute('data-i18n-aria')));
      });
      const description = document.querySelector('meta[name="description"]');
      if (description) { description.setAttribute('content', t('meta_description')); }

      /* Metric labels and retention preset labels are data-driven: the catalog
         supplies the words, the numbers stay as they are. */
      METRIC_KEYS.forEach(function (key) { METRIC_CONFIG[key].label = t(key); });
      HISTORY_CONFIG.presets.forEach(function (preset) {
        preset.label = retentionText(preset.retentionMs);
      });

      if (uiState.dashboardReady) {
        buildPanels();
        renderCurrentMode();
        renderConnectionState();
      }
    }

    /* Language selection: the first screen on every start. No persistence and no
       network request — the dashboard is built and polled only after the choice. */
    function chooseLocale(id) {
      if (!isLocale(id)) { return null; }
      activeLocale = id;
      uiState.locale = id;
      uiState.screen = 'dashboard';

      const screen = document.getElementById('language-screen');
      const shell = document.getElementById('app-shell');
      if (screen) { screen.hidden = true; }
      if (shell) { shell.hidden = false; }
      applyLocale();
      enterDashboard();
      return id;
    }

    function wireLanguageScreen() {
      if (typeof document === 'undefined') { return; }
      const buttons = document.querySelectorAll('.langbutton[data-locale]');
      Array.prototype.forEach.call(buttons, function (button) {
        button.addEventListener('click', function () { chooseLocale(button.dataset.locale); });
      });
    }

    /* The dashboard is built and polled only once a language was chosen. */
    function enterDashboard() {
      if (uiState.dashboardReady) { return; }
      uiState.dashboardReady = true;
      buildPanels();
      setActiveMode(DEFAULT_MODE);
      startUiTicker();
      pollOnce();
    }

    function init() {
      cacheDom();
      initTabs();
      historyConfigure(HISTORY_CONFIG.defaultPresetId, Date.now());
      wireLanguageScreen();
      applyLocale();   /* paints the language screen in the default text locale */
      if (typeof document !== 'undefined' && document.addEventListener) {
        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('resize', handleResize);
      }
    }

    if (typeof document !== 'undefined') {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    }
  </script>
</body>
</html>
